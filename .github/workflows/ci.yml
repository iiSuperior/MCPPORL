name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure
        run: cmake -S sim -B sim/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build sim/build --config Release
      - name: C++ tests
        run: ctest --test-dir sim/build -C Release --output-on-failure
      - name: Python tests
        run: python -m unittest discover -s tools -v
